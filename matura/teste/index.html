<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matura Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@500&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="config.js"></script>
<script src="tests.enc.js"></script>
<style>
/* Layout: one sheet of squared exercise-book paper with a red margin line; the test list and each test live on the same sheet. */
:root {
  --desk: #e9e4d8;
  --paper: #fbf9f3;
  --grid: rgba(60, 100, 160, .12);
  --margin: rgba(200, 70, 60, .45);
  --ink: #1d2433;
  --ink-2: #5d6371;
  --pen: #1f4e8c;
  --red: #b8392b;
  --ok: #2e7d4f;
  --field: #ffffff;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --hand: "Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #121418; --paper: #1d2128; --grid: rgba(150, 180, 225, .07); --margin: rgba(235, 120, 105, .35);
  --ink: #e9e6de; --ink-2: #a8adb6; --pen: #91b7ea; --red: #ef8f7f; --ok: #7fcb9d; --field: #252a33; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #121418; --paper: #1d2128; --grid: rgba(150, 180, 225, .07); --margin: rgba(235, 120, 105, .35);
  --ink: #e9e6de; --ink-2: #a8adb6; --pen: #91b7ea; --red: #ef8f7f; --ok: #7fcb9d; --field: #252a33; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.6;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px; }
.sheet { max-width: 860px; margin: 0 auto; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08);
  position: relative; padding: 28px 28px 48px 72px; min-height: 80vh; }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 52px; width: 2px; background: var(--margin); }
@media (max-width: 600px) { .sheet { padding: 20px 14px 40px 40px; } .sheet::before { left: 26px; } body { font-size: 16px; } }

.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.who { font-family: var(--hand); font-size: 1.6rem; color: var(--pen); line-height: 1; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--ink-2); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 .85rem var(--serif); padding: 5px 11px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
h1 { font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.3rem); line-height: 1.15; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 0 0 26px; max-width: 62ch; }

/* list */
.list { display: grid; gap: 0; border-top: 1px solid var(--ink-2); }
.row { display: grid; grid-template-columns: 3.2rem minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid color-mix(in srgb, var(--ink-2) 35%, transparent); text-decoration: none; color: inherit; }
a.row:hover { background: color-mix(in srgb, var(--pen) 7%, transparent); }
.row .no { font-family: var(--mono); font-size: 1.05rem; color: var(--pen); }
.row .tt { font-weight: 600; }
.row .dd { font-size: .88rem; color: var(--ink-2); }
.row.locked { color: var(--ink-2); }
.row.locked .no { color: var(--ink-2); }
.stamp { font-family: var(--hand); font-size: 1.25rem; line-height: 1; white-space: nowrap; }
.stamp.open { color: var(--pen); } .stamp.sent { color: var(--ok); } .stamp.lock { color: var(--ink-2); font-family: var(--serif); font-size: .85rem; }

/* test */
.back { display: inline-block; margin-bottom: 14px; color: var(--pen); text-decoration: none; font-weight: 600; }
.rules { border: 1px dashed var(--ink-2); padding: 10px 14px; margin: 0 0 26px; font-size: .93rem; color: var(--ink-2); }
.q { margin: 0 0 28px; }
.qh { display: flex; gap: 10px; align-items: baseline; }
.qn { font-family: var(--mono); color: var(--pen); min-width: 2.2rem; }
.pts { margin-left: auto; font-size: .8rem; color: var(--ink-2); white-space: nowrap; }
.qt { flex: 1; min-width: 0; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 18px; margin: 10px 0 0 2.2rem; }
@media (max-width: 600px) { .opts { grid-template-columns: 1fr; margin-left: 0; } }
.opt { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; min-width: 0; overflow-x: auto; }
.opt:hover { border-color: color-mix(in srgb, var(--ink-2) 50%, transparent); }
.opt input { accent-color: var(--pen); width: 18px; height: 18px; flex: none; }
.opt b { font-family: var(--mono); font-weight: 500; }
.opt.sel { border-color: var(--pen); background: color-mix(in srgb, var(--pen) 8%, transparent); }
.open { margin: 10px 0 0 2.2rem; display: grid; gap: 8px; }
@media (max-width: 600px) { .open { margin-left: 0; } }
.open label { font-size: .85rem; color: var(--ink-2); }
.open input, .open textarea { font: 1rem var(--serif); color: var(--ink); background: var(--field); border: 1px solid var(--ink-2); border-radius: 4px; padding: 7px 10px; width: 100%; }
.open input { max-width: 280px; font-family: var(--mono); }
.open textarea { min-height: 120px; resize: vertical; }
.hintline { font-size: .82rem; color: var(--ink-2); }

.submit { margin-top: 30px; border-top: 2px solid var(--ink); padding-top: 18px; display: grid; gap: 12px; }
.btn { font: 700 1rem var(--serif); padding: 10px 18px; border-radius: 6px; border: 2px solid var(--pen); background: var(--pen); color: var(--paper); cursor: pointer; justify-self: start; }
.btn.ghost { background: transparent; color: var(--pen); }
.btn:disabled { opacity: .5; cursor: default; }
.note { color: var(--ink-2); font-size: .92rem; }
.status { font-family: var(--hand); font-size: 1.6rem; color: var(--ok); }
.err { color: var(--red); }
textarea.code { font: .8rem var(--mono); width: 100%; min-height: 90px; color: var(--ink); background: var(--field); border: 1px solid var(--ink-2); }
.done-q { opacity: .85; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.katex { font-size: 1.05em; }
.katex-display { margin: .4em 0; overflow-x: auto; overflow-y: hidden; }
</style>
</head>
<body>
<main class="sheet" id="sheet"></main>

<script>
const I18N = {
  en: {
    title: "Matura maths — tests", sub: "A new test opens every Wednesday and Saturday. Do it in one sitting, then press Submit. We go through your answers in the next two lessons.",
    test: "Test", opens: "opens", openNow: "open", sent: "sent", locked: "locked", daysLeft: d => d === 1 ? "in 1 day" : `in ${d} days`,
    back: "← All tests", rules: "About 60 minutes. Simple calculator and the CKE formula sheet allowed. Closed questions: choose one answer (1 point). Open questions: write the final answer and your working (2 points).",
    final: "Final answer", work: "Working (all steps)", proof: "Proof (write the full reasoning)", pt: n => n === 1 ? "1 pt" : `${n} pts`,
    finalHint: "A number or expression, e.g. 12, -3/4, 2√3, 9π",
    submit: "Submit test", confirm: "Submit now? You cannot change answers afterwards.", yes: "Yes, submit", no: "Not yet",
    unanswered: n => `${n} question(s) still empty.`, sending: "Sending…", sentOk: "Sent ✓", sentAt: "Submitted",
    fail: "Could not send. Copy the code below and paste it into the Preply chat.", noUrl: "Automatic sending is not set up yet. Copy the code below and paste it into the Preply chat.",
    copy: "Copy code", copied: "Copied", until: "open until", closed: "closed", closedMsg: "The deadline for this test has passed:", plTime: "Polish time", manual: "Saved — send the code below", lockedMsg: "This test is not open yet.", loading: "Loading…", sendFail: "Sending failed. Your answers are saved on this device — check your connection and press Submit again.", needCode: "Open this page with the link from your Preply message.", badCode: "This link is not valid. Use the link from your Preply message.", net: "Cannot reach the server. Check your connection and reload the page."
  },
  pl: {
    title: "Matura z matematyki — sprawdziany", sub: "Nowy sprawdzian otwiera się w każdą środę i sobotę. Rozwiąż go za jednym razem i kliknij „Wyślij”. Odpowiedzi omawiamy na dwóch kolejnych lekcjach.",
    test: "Sprawdzian", opens: "otwarcie", openNow: "otwarty", sent: "wysłany", locked: "zamknięty", daysLeft: d => d === 1 ? "za 1 dzień" : `za ${d} dni`,
    back: "← Wszystkie sprawdziany", rules: "Około 60 minut. Można korzystać z prostego kalkulatora i karty wzorów CKE. Zadania zamknięte: wybierz jedną odpowiedź (1 pkt). Zadania otwarte: wpisz odpowiedź końcową i rozwiązanie (2 pkt).",
    final: "Odpowiedź końcowa", work: "Rozwiązanie (wszystkie kroki)", proof: "Dowód (zapisz pełne rozumowanie)", pt: n => `${n} pkt`,
    finalHint: "Liczba lub wyrażenie, np. 12, -3/4, 2√3, 9π",
    submit: "Wyślij sprawdzian", confirm: "Wysłać teraz? Po wysłaniu nie można zmienić odpowiedzi.", yes: "Tak, wyślij", no: "Jeszcze nie",
    unanswered: n => `Bez odpowiedzi: ${n}.`, sending: "Wysyłanie…", sentOk: "Wysłano ✓", sentAt: "Wysłano",
    fail: "Nie udało się wysłać. Skopiuj poniższy kod i wklej go na czacie Preply.", noUrl: "Automatyczne wysyłanie nie jest jeszcze włączone. Skopiuj poniższy kod i wklej go na czacie Preply.",
    copy: "Kopiuj kod", copied: "Skopiowano", until: "otwarty do", closed: "zamknięty", closedMsg: "Termin na ten sprawdzian minął:", plTime: "czas polski", manual: "Zapisano — wyślij poniższy kod", lockedMsg: "Ten sprawdzian nie jest jeszcze otwarty.", loading: "Wczytywanie…", sendFail: "Wysyłanie nie powiodło się. Odpowiedzi są zapisane na tym urządzeniu — sprawdź internet i kliknij „Wyślij” ponownie.", needCode: "Otwórz tę stronę linkiem z wiadomości na Preply.", badCode: "Ten link jest nieprawidłowy. Użyj linku z wiadomości na Preply.", net: "Brak połączenia z serwerem. Sprawdź internet i odśwież stronę."
  }
};
const LETTERS = ["A","B","C","D"];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let lang = store.get("lang", "en");
let theme = store.get("theme", "system");
const qs0 = new URLSearchParams(location.search);
if (qs0.get("k")) { store.set("code", qs0.get("k")); history.replaceState(null, "", location.pathname + location.hash); }
const CODE = store.get("code", "");
let META = null, META_ERR = null;
const ITEMS = {};
async function loadMeta() {
  if (!CODE) { META_ERR = "nocode"; return; }
  try { const r = await fetch(window.SHEET_URL + "?a=meta&k=" + encodeURIComponent(CODE)); const j = await r.json(); if (j.error) META_ERR = j.error; else META = j; }
  catch (e) { META_ERR = "net"; }
}
function mt(t) { return META ? META.tests.find(x => x.n === t.n) : null; }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function getItems(t) {
  const r = await fetch(window.SHEET_URL + "?a=key&n=" + t.n + "&k=" + encodeURIComponent(CODE));
  const j = await r.json();
  if (!j.key) throw new Error(j.error || "locked");
  const key = await crypto.subtle.importKey("raw", b64(j.key), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(t.iv) }, key, b64(t.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function applyTheme() { if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme); }
applyTheme();

function todayWarsaw() { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Warsaw", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
function isOpen(t) { const x = mt(t); return !!(x && x.open); }
function deadline(t) { const x = mt(t); return x && x.deadline ? new Date(x.deadline) : null; }
function isClosed(t) { const d = deadline(t); return !!d && META.role !== "admin" && Date.now() > d.getTime(); }
function fmtDT(d) { return d.toLocaleString(lang === "pl" ? "pl-PL" : "en-GB", { timeZone: "Europe/Warsaw", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function daysTo(d) { return Math.round((Date.parse(d + "T00:00:00Z") - Date.parse(todayWarsaw() + "T00:00:00Z")) / 864e5); }
function fmtDate(d) { return new Date(d + "T12:00:00Z").toLocaleDateString(lang === "pl" ? "pl-PL" : "en-GB", { weekday: "short", day: "numeric", month: "short" }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const T = () => I18N[lang];
const txt = o => (Array.isArray(o) ? (lang === "pl" ? o[1] : o[0]) : o);

function header() {
  return `<div class="top">
    <div class="who">Matura 2027</div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" aria-pressed="${lang === "en"}">EN</button><button id="lang-pl" aria-pressed="${lang === "pl"}">PL</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button id="th-light" aria-pressed="${theme === "light"}">Light</button><button id="th-dark" aria-pressed="${theme === "dark"}">Dark</button>
      </div>
    </div>
  </div>`;
}
function wireHeader() {
  document.getElementById("lang-en").onclick = () => { lang = "en"; store.set("lang", lang); route(true); };
  document.getElementById("lang-pl").onclick = () => { lang = "pl"; store.set("lang", lang); route(true); };
  document.getElementById("th-light").onclick = () => { theme = theme === "light" ? "system" : "light"; store.set("theme", theme); applyTheme(); route(true); };
  document.getElementById("th-dark").onclick = () => { theme = theme === "dark" ? "system" : "dark"; store.set("theme", theme); applyTheme(); route(true); };
}

function renderList() {
  const rows = TESTS.map(t => {
    const sent = store.get("sent-" + t.n, null);
    const open = isOpen(t);
    let stamp;
    if (sent) stamp = `<span class="stamp sent">${T().sent} ✓</span>`;
    else if (open && isClosed(t)) stamp = `<span class="stamp lock">${T().closed}</span>`;
    else if (open) stamp = `<span class="stamp open">${T().openNow} →</span>`;
    else stamp = `<span class="stamp lock">${T().daysLeft(daysTo(t.d))}</span>`;
    const inner = `<span class="no">${String(t.n).padStart(2, "0")}</span>
      <span><span class="tt">${esc(lang === "pl" ? t.pl : t.en)}</span><br><span class="dd">${T().opens}: ${fmtDate(t.d)}${deadline(t) ? ` · ${T().until}: ${fmtDT(deadline(t))}` : ""}</span></span>${stamp}`;
    return open ? `<a class="row" href="#t${t.n}">${inner}</a>` : `<div class="row locked">${inner}</div>`;
  }).join("");
  const warn = META_ERR ? `<p class="note err">${{ nocode: T().needCode, code: T().badCode }[META_ERR] || T().net}</p>` : "";
  document.getElementById("sheet").innerHTML = header() + `<h1>${T().title}</h1><p class="sub">${T().sub}</p>${warn}<div class="list">${rows}</div>`;
  wireHeader();
}

function renderTest(n) {
  const t = TESTS.find(x => x.n === n);
  if (!t) return renderList();
  if (!isOpen(t)) { document.getElementById("sheet").innerHTML = header() + `<a class="back" href="#">${T().back}</a><p>${T().lockedMsg} ${T().opens}: ${fmtDate(t.d)}.</p>`; wireHeader(); return; }
  if (!ITEMS[n]) {
    document.getElementById("sheet").innerHTML = header() + `<a class="back" href="#">${T().back}</a><p class="note">${T().loading}</p>`; wireHeader();
    getItems(t).then(items => { ITEMS[n] = items; if (location.hash === "#t" + n) renderTest(n); })
      .catch(() => { document.getElementById("sheet").innerHTML = header() + `<a class="back" href="#">${T().back}</a><p class="note err">${T().net}</p>`; wireHeader(); });
    return;
  }
  const items = ITEMS[n];
  const draft = store.get("draft-" + n, { c: {}, o: {} });
  const sent = store.get("sent-" + n, null);
  const closed = !sent && isClosed(t);
  const ro = (sent || closed) ? "disabled" : "";
  const qs = items.map((it, i) => {
    const num = i + 1;
    const q = lang === "pl" ? it.pl : it.en;
    if (it.t === "c") {
      const opts = it.o.map((o, k) => {
        const sel = draft.c[num] === LETTERS[k];
        return `<label class="opt ${sel ? "sel" : ""}"><input type="radio" name="q${num}" id="q${num}${LETTERS[k]}" value="${LETTERS[k]}" ${sel ? "checked" : ""} ${ro}><b>${LETTERS[k]}.</b><span>${txt(o)}</span></label>`;
      }).join("");
      return `<section class="q ${sent ? "done-q" : ""}"><div class="qh"><span class="qn">${num}.</span><div class="qt">${q}</div><span class="pts">${T().pt(1)}</span></div><div class="opts">${opts}</div></section>`;
    }
    const d = draft.o[num] || { final: "", work: "" };
    const finalField = it.proof ? "" : `<label for="f${num}">${T().final}</label><input id="f${num}" data-n="${num}" data-k="final" value="${esc(d.final)}" placeholder="${T().finalHint}" ${ro} autocomplete="off">`;
    return `<section class="q ${sent ? "done-q" : ""}"><div class="qh"><span class="qn">${num}.</span><div class="qt">${q}</div><span class="pts">${T().pt(2)}</span></div>
      <div class="open">${finalField}<label for="w${num}">${it.proof ? T().proof : T().work}</label><textarea id="w${num}" data-n="${num}" data-k="work" ${ro}>${esc(d.work)}</textarea></div></section>`;
  }).join("");
  const sentBlock = sent ? `<div class="status">${sent.ok ? T().sentOk : T().manual}</div><div class="note">${T().sentAt}: ${new Date(sent.at).toLocaleString(lang === "pl" ? "pl-PL" : "en-GB")}</div>${sent.ok ? "" : codeBox(sent.payload, sent.reason)}`
    : closed ? `<p class="note err">${T().closedMsg} ${fmtDT(deadline(t))}.</p>`
    : `${deadline(t) ? `<p class="note">${T().until}: <b>${fmtDT(deadline(t))}</b> (${T().plTime})</p>` : ""}<button class="btn" id="submit">${T().submit}</button><div id="confirm"></div>`;
  document.getElementById("sheet").innerHTML = header() + `<a class="back" href="#">${T().back}</a>
    <h1>${T().test} ${t.n}: ${esc(lang === "pl" ? t.pl : t.en)}</h1><p class="rules">${T().rules}</p>${qs}<div class="submit">${sentBlock}</div>`;
  wireHeader();
  renderMath();
  if (sent) { wireCopy(); return; }
  if (closed) return;
  document.querySelectorAll('input[type="radio"]').forEach(r => r.addEventListener("change", () => {
    const num = +r.name.slice(1); draft.c[num] = r.value; store.set("draft-" + n, draft);
    document.querySelectorAll(`input[name="q${num}"]`).forEach(x => x.closest(".opt").classList.toggle("sel", x.checked));
  }));
  document.querySelectorAll(".open input, .open textarea").forEach(el => el.addEventListener("input", () => {
    const num = +el.dataset.n; draft.o[num] = draft.o[num] || { final: "", work: "" }; draft.o[num][el.dataset.k] = el.value; store.set("draft-" + n, draft);
  }));
  document.getElementById("submit").onclick = () => {
    const empty = items.filter((it, i) => it.t === "c" ? !draft.c[i + 1] : !(draft.o[i + 1] && ((draft.o[i + 1].final || "").trim() || (draft.o[i + 1].work || "").trim()))).length;
    document.getElementById("confirm").innerHTML = `<p class="note">${empty ? `<span class="err">${T().unanswered(empty)}</span> ` : ""}${T().confirm}</p>
      <div class="toggles"><button class="btn" id="yes">${T().yes}</button><button class="btn ghost" id="no">${T().no}</button></div>`;
    document.getElementById("no").onclick = () => { document.getElementById("confirm").innerHTML = ""; };
    document.getElementById("yes").onclick = () => send(t, draft);
  };
}

function codeBox(payload, reason) {
  return `<p class="note err">${reason === "nourl" ? T().noUrl : T().fail}</p><textarea class="code" id="code" readonly>${esc(JSON.stringify(payload))}</textarea><button class="btn ghost" id="copy">${T().copy}</button>`;
}
function wireCopy() {
  const b = document.getElementById("copy"); if (!b) return;
  b.onclick = () => { const ta = document.getElementById("code");
    navigator.clipboard.writeText(ta.value).then(() => { b.textContent = T().copied; }).catch(() => { ta.select(); }); };
}

async function send(t, draft) {
  document.getElementById("confirm").innerHTML = `<p class="note">${T().sending}</p>`;
  const payload = { test: t.n, k: CODE, lang, submittedAt: new Date().toISOString(), closed: draft.c, open: draft.o };
  let ok = false, reason = "fail";
  try {
    const r = await fetch(window.SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    const j = await r.json(); ok = !!j.ok; reason = j.reason || (ok ? "" : "fail");
  } catch (e) { reason = "fail"; }
  if (reason === "closed") { await loadMeta(); renderTest(t.n); return; }
  if (!ok) { document.getElementById("confirm").innerHTML = `<p class="note err">${reason === "code" ? T().badCode : T().sendFail}</p>`; return; }
  store.set("sent-" + t.n, { at: Date.now(), ok: true });
  renderTest(t.n);
}

function renderMath() {
  if (window.renderMathInElement) renderMathInElement(document.getElementById("sheet"), { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });
}
function route(keep) {
  const m = location.hash.match(/^#t(\d+)$/);
  if (m) renderTest(+m[1]); else renderList();
  if (!m) renderMath();
  if (!keep) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => route());
document.getElementById("sheet").innerHTML = `<p class="note">${T().loading}</p>`;
loadMeta().then(() => route());
</script>
